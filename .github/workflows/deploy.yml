name: CD - Build, Push & Deploy EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-eks
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  JAVA_VERSION: "21"
  CLUSTER_NAME: tech-challenge
  NAMESPACE: tech-challenge
  ECR_REPOSITORY: tech-challenge-app

jobs:
  deploy:
    name: Build, Push ECR & Deploy EKS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "corretto"
          java-version: ${{ env.JAVA_VERSION }}
          cache: "gradle"

      - name: Configurar Credenciais AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login no Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build e Push da Imagem Docker
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          echo "Compilando e publicando imagem: ${IMAGE_URI}:${IMAGE_TAG}"

          docker build \
            --platform linux/amd64 \
            -t "${IMAGE_URI}:${IMAGE_TAG}" \
            -t "${IMAGE_URI}:latest" \
            -f app/Dockerfile .

          docker push "${IMAGE_URI}:${IMAGE_TAG}"
          docker push "${IMAGE_URI}:latest"

      - name: Configurar Kubeconfig para o Cluster EKS
        run: |
          aws eks update-kubeconfig \
            --region ${{ env.AWS_REGION }} \
            --name ${{ env.CLUSTER_NAME }}

      - name: Aplicar ConfigMap
        run: kubectl apply -f k8s/configmap.yaml

      - name: Criar ou Atualizar Secrets no Kubernetes
        run: |
          kubectl create secret generic app-secrets \
            --namespace=${{ env.NAMESPACE }} \
            --from-literal=SPRING_DATASOURCE_URL="${{ secrets.DB_URL }}" \
            --from-literal=SPRING_DATASOURCE_USERNAME="${{ secrets.DB_USER }}" \
            --from-literal=SPRING_DATASOURCE_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            --from-literal=JWT_SECRET="${{ secrets.JWT_SECRET }}" \
            --from-literal=WEBHOOK_APROVACAO_SECRET="${{ secrets.WEBHOOK_APROVACAO_SECRET }}" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Injetar Imagem e Aplicar Manifestos no EKS
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_FULL="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"
          sed -i "s|IMAGE_PLACEHOLDER|${IMAGE_FULL}|g" k8s/deployment.yaml

          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml
          kubectl apply -f k8s/pod-disruption-budget.yaml

      - name: Verificar Rollout do Deployment
        run: |
          kubectl rollout status deployment/tech-challenge-app \
            -n ${{ env.NAMESPACE }} \
            --timeout=300s

      - name: Exibir Endpoint do Load Balancer
        run: |
          echo "=========================================================="
          echo "Aguardando endpoint do LoadBalancer..."
          sleep 10
          LB_HOSTNAME=$(kubectl get svc tech-challenge-app-service \
            -n ${{ env.NAMESPACE }} \
            -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "Pendente")
          echo "DNS do Load Balancer: http://${LB_HOSTNAME}"
          echo "Swagger UI: http://${LB_HOSTNAME}/swagger-ui/index.html"
          echo "=========================================================="
