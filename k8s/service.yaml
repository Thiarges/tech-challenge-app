apiVersion: v1
kind: Service
metadata:
  name: tech-challenge-app-service
  namespace: tech-challenge
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: tech-challenge-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
