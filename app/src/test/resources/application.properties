spring.application.name=techchallenge

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=oficina

# Configuração do Flyway
spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.schemas=oficina
spring.flyway.default-schema=oficina

# Configuração Docker Compose
spring.docker.compose.skip.in-tests=false
spring.docker.compose.file=src/test/resources/docker-compose-test.yaml
spring.docker.compose.lifecycle-management=start_and_stop
spring.docker.compose.start.arguments[0]=--force-recreate
spring.docker.compose.stop.command=down
spring.docker.compose.stop.arguments[0]=--volumes
spring.docker.compose.stop.arguments[1]=--remove-orphans

#spring.security.user.name=admin
#spring.security.user.password=admin

# Configuração JWT
jwt.secret=jwt-test-secret-key-for-unit-tests-only-minimum-32-chars
jwt.access-token-expiration=3600

# Configuração Webhook
webhook.aprovacao-cliente.secret=webhook-secret-key-123
