spring.application.name=techchallenge
logging.structured.format.console=logstash

# Banco de dados
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:postgresql://localhost:5432/techchallenge}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:admin}}
spring.datasource.driver-class-name=org.postgresql.Driver
# The HPA can create up to ten Pods; cap each pool to protect RDS connections.
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.initialization-fail-timeout=30000

# JPA e Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=oficina

# Migrations Flyway
spring.flyway.enabled=true
spring.flyway.create-schemas=true
spring.flyway.schemas=oficina
spring.flyway.default-schema=oficina

# Desabilita docker compose integrado em tempo de execucao
spring.docker.compose.enabled=false

# Seguranca e JWT
jwt.secret=${JWT_SECRET:minha-chave-secreta-dev-minimo-32-chars!!}
jwt.access-token-expiration=${JWT_ACCESS_EXP:3600}

# Webhook
webhook.aprovacao-cliente.secret=${WEBHOOK_APROVACAO_SECRET:webhook-secret-key-123}

# Actuator e Health Probes
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# Swagger OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.config-url=${SWAGGER_BASE_PATH:}/v3/api-docs/swagger-config
springdoc.swagger-ui.url=${SWAGGER_BASE_PATH:}/v3/api-docs
